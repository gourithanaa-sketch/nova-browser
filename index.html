
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA Browser V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b15;color:white;font-family:Arial,sans-serif}
header{height:60px;background:#111629;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #303958}
.logo{font-size:24px;font-weight:bold;letter-spacing:3px}
.logo span{color:#a477ff}
.tabs{display:flex;gap:6px;background:#0c1020;padding:8px;overflow-x:auto}
.tab{background:#1a2035;color:#ddd;border:1px solid #303958;border-radius:9px;padding:10px 15px;cursor:pointer;white-space:nowrap}
.tab.active{background:#49336f;border-color:#a477ff}
.toolbar{display:flex;gap:7px;padding:10px;background:#151b2d;align-items:center}
.tool{background:#29324b;color:white;border:0;border-radius:9px;padding:11px;cursor:pointer}
.tool:hover{background:#49336f}
#address{flex:1;min-width:0;padding:12px;background:#090e20;color:white;border:1px solid #384362;border-radius:9px}
#go{background:#956aff;color:white;border:0;padding:12px 18px;border-radius:9px;cursor:pointer;font-weight:bold}
#browser{height:calc(100vh - 150px);min-height:400px;background:#fff;position:relative}
iframe{width:100%;height:100%;border:0;display:none}
#home{height:100%;overflow:auto;background:radial-gradient(ellipse at top,#29204d,#090b15 70%);text-align:center;padding:45px 15px}
#home h1{font-size:48px;margin:15px}
#home h1 span{color:#a477ff}
#home p{color:#a6aec8}
.grid{max-width:750px;margin:35px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:13px}
.card{background:#171e34;border:1px solid #303958;border-radius:14px;padding:22px 10px;cursor:pointer;color:white}
.card:hover{border-color:#a477ff}
.card b{display:block;font-size:28px;margin-bottom:10px}
#arcade{display:none;background:#0d1223;height:100%;overflow:auto;text-align:center;padding:20px}
canvas{width:min(100%,600px);height:auto;background:#080d1b;border:1px solid #59448b;border-radius:12px}
.primary{background:#956aff;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer}
#status{height:25px;background:#111629;color:#929dbb;font-size:11px;padding:6px 12px}
</style>
</head>
<body>

<header>
<div class="logo">NOVA<span>.</span></div>
</header>

<div class="tabs" id="tabs"></div>

<div class="toolbar">
<button class="tool" onclick="back()">←</button>
<button class="tool" onclick="forward()">→</button>
<button class="tool" onclick="refresh()">↻</button>
<button class="tool" onclick="goHome()">⌂</button>
<input id="address" placeholder="Search or enter a website...">
<button id="go" onclick="navigate()">GO</button>
<button class="tool" onclick="newTab()">+</button>
</div>

<div id="browser">
<div id="home">
<h1>Welcome to <span>NOVA</span></h1>
<p>Your own browsing space.</p>

<div class="grid">
<div class="card" onclick="openSite('https://www.google.com')"><b>🔎</b>Google</div>
<div class="card" onclick="openSite('https://www.youtube.com')"><b>▶️</b>YouTube</div>
<div class="card" onclick="openSite('https://www.tiktok.com')"><b>🎵</b>TikTok</div>
<div class="card" onclick="openSite('https://www.wikipedia.org')"><b>📚</b>Wikipedia</div>
<div class="card" onclick="openSite('https://www.coolmathgames.com')"><b>🎮</b>Games</div>
<div class="card" onclick="showArcade()"><b>⭐</b>NOVA Arcade</div>
</div>
<p>Enter a website address above to browse inside NOVA.</p>
</div>

<div id="arcade">
<h2>⭐ NOVA ARCADE</h2>
<p>Catch stars and avoid rocks!</p>
<canvas id="game" width="600" height="300"></canvas>
<p id="score">Score: 0</p>
<button class="primary" onclick="startGame()">Start Game</button>
<p>Move using arrow keys or A and D.</p>
</div>
</div>

<div id="status">NOVA ready · Home</div>

<script>
let tabs=[{url:"",title:"NOVA Home",history:[],index:-1}];
let active=0;

const address=document.getElementById("address");
const home=document.getElementById("home");
const arcade=document.getElementById("arcade");
const browser=document.getElementById("browser");
const statusText=document.getElementById("status");

function renderTabs(){
 const area=document.getElementById("tabs");
 area.innerHTML="";
 tabs.forEach((t,i)=>{
  let b=document.createElement("button");
  b.className="tab "+(i===active?"active":"");
  b.textContent=t.title;
  b.onclick=()=>switchTab(i);
  area.appendChild(b);
 });
}

function switchTab(i){
 active=i;
 renderTabs();
 let t=tabs[i];
 if(t.url)loadPage(t.url);
 else goHome();
}

function newTab(){
 tabs.push({url:"",title:"New Tab",history:[],index:-1});
 switchTab(tabs.length-1);
}

function loadPage(url){
 home.style.display="none";
 arcade.style.display="none";

 let frame=document.getElementById("frame-"+active);

 if(!frame){
  frame=document.createElement("iframe");
  frame.id="frame-"+active;
  frame.allow="fullscreen; autoplay; encrypted-media; picture-in-picture";
  browser.appendChild(frame);
 }

 document.querySelectorAll("iframe").forEach(f=>f.style.display="none");
 frame.style.display="block";

 if(frame.src!==url)frame.src=url;

 address.value=url;
 statusText.textContent="NOVA · "+url;
}

function navigate(){
 let q=address.value.trim();
 if(!q)return;

 let url;

 if(/^https?:\/\//i.test(q)){
  url=q;
 }else if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(q)){
  url="https://"+q;
 }else{
  url="https://www.google.com/search?q="+encodeURIComponent(q);
 }

 let t=tabs[active];
 t.history=t.history.slice(0,t.index+1);
 t.history.push(url);
 t.index=t.history.length-1;
 t.url=url;
 t.title=new URL(url).hostname;

 renderTabs();
 loadPage(url);
}

function openSite(url){
 address.value=url;
 navigate();
}

function goHome(){
 tabs[active]={url:"",title:"NOVA Home",history:[],index:-1};
 renderTabs();
 home.style.display="block";
 arcade.style.display="none";
 document.querySelectorAll("iframe").forEach(f=>f.style.display="none");
 address.value="";
 statusText.textContent="NOVA · Home";
}

function back(){
 let t=tabs[active];
 if(t.index>0){
  t.index--;
  t.url=t.history[t.index];
  loadPage(t.url);
 }
}

function forward(){
 let t=tabs[active];
 if(t.index<t.history.length-1){
  t.index++;
  t.url=t.history[t.index];
  loadPage(t.url);
 }
}

function refresh(){
 let f=document.getElementById("frame-"+active);
 if(f)f.src=f.src;
}

address.addEventListener("keydown",e=>{
 if(e.key==="Enter")navigate();
});

// NOVA ARCADE

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let player={x:280,y:260,w:40,h:20};
let objects=[],score=0,running=false,keys={},ticks=0,animation;

document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});
document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function showArcade(){
 home.style.display="none";
 arcade.style.display="block";
 document.querySelectorAll("iframe").forEach(f=>f.style.display="none");
 statusText.textContent="NOVA · Arcade";
}

function draw(){
 ctx.clearRect(0,0,600,300);
 ctx.fillStyle="#a477ff";
 ctx.fillRect(player.x,player.y,player.w,player.h);
 ctx.font="22px Arial";
 objects.forEach(o=>{
  ctx.fillText(o.type==="star"?"⭐":"🪨",o.x,o.y);
 });
}

function startGame(){
 cancelAnimationFrame(animation);
 player.x=280;
 objects=[];
 score=0;
 ticks=0;
 running=true;
 document.getElementById("score").textContent="Score: 0";
 loop();
}

function loop(){
 if(!running)return;

 if(keys.arrowleft||keys.a)player.x-=5;
 if(keys.arrowright||keys.d)player.x+=5;
 player.x=Math.max(0,Math.min(560,player.x));

 ticks++;
 if(ticks%35===0){
  objects.push({
   x:Math.random()*570,
   y:-10,
   type:Math.random()<.8?"star":"rock"
  });
 }

 objects.forEach(o=>o.y+=3);

 objects=objects.filter(o=>{
  if(o.y>300)return false;

  if(o.x>player.x-12&&
     o.x<player.x+player.w+12&&
     o.y>player.y-12&&
     o.y<player.y+player.h+12){

   if(o.type==="star"){
    score++;
    document.getElementById("score").textContent="Score: "+score;
   }else{
    running=false;
    document.getElementById("score").textContent="Game over! Score: "+score;
   }
   return false;
  }
  return true;
 });

 draw();
 if(running)animation=requestAnimationFrame(loop);
}

draw();
renderTabs();
</script>
</body>
</html>
